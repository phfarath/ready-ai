name: Documentation Regression Test

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src/**"
      - "app/**"
      - "components/**"
      - "pages/**"
      - ".ready-ai.yaml"
      - ".ready-ai.yml"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Visual similarity threshold"
        required: true
        default: "0.85"
      staging_url:
        description: "Staging URL to test against"
        required: false

env:
  STAGING_URL: ${{ vars.STAGING_URL || github.event.inputs.staging_url }}
  THRESHOLD: ${{ github.event.inputs.threshold || '0.85' }}

jobs:
  regression-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Check regression prerequisites
        id: prerequisites
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation regression skipped: configure the STAGING_URL repository variable or provide staging_url when dispatching manually."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # ─── Download baseline docs ───────────────────────────────────────
      - name: Download latest docs baseline
        id: baseline
        if: steps.prerequisites.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./docs-baseline
          
          # 1. Try artifact from latest docs-generation run
          LATEST_RUN=$(gh run list --workflow=docs-generation.yml --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$LATEST_RUN" ]; then
            gh run download "$LATEST_RUN" --dir ./docs-artifact 2>/dev/null || true
            if [ -d "./docs-artifact" ]; then
              # Find docs.md inside artifact subdirectories
              find ./docs-artifact -name "docs.md" -exec cp {} ./docs-baseline/docs.md \; 2>/dev/null || true
              find ./docs-artifact -type d -name "screenshots" -exec cp -r {} ./docs-baseline/screenshots \; 2>/dev/null || true
            fi
          fi
          
          # 2. Fallback: try docs branch
          if [ ! -s "./docs-baseline/docs.md" ]; then
            rm -f ./docs-baseline/docs.md
            git fetch origin docs/latest:docs/latest 2>/dev/null || true
            if git show docs/latest:output/latest/docs.md > ./docs-baseline/docs.md 2>/dev/null && [ -s "./docs-baseline/docs.md" ]; then
              # Screenshots from branch (best effort)
              git checkout docs/latest -- output/latest/screenshots 2>/dev/null || true
              if [ -d "output/latest/screenshots" ]; then
                cp -r output/latest/screenshots ./docs-baseline/
              fi
            else
              rm -f ./docs-baseline/docs.md
            fi
          fi
          
          # 3. Last fallback: try any ./output/*/docs.md from this repo
          if [ ! -s "./docs-baseline/docs.md" ]; then
            BASE=$(find ./output -name "docs.md" -type f -print -quit 2>/dev/null || true)
            if [ -n "$BASE" ]; then
              cp "$BASE" ./docs-baseline/docs.md
              BASEDIR=$(dirname "$BASE")
              if [ -d "$BASEDIR/screenshots" ]; then
                cp -r "$BASEDIR/screenshots" ./docs-baseline/
              fi
            fi
          fi
          
          if [ -s "./docs-baseline/docs.md" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=./docs-baseline" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # ─── Run regression test ──────────────────────────────────────────
      - name: Run regression test
        if: steps.prerequisites.outputs.enabled == 'true' && steps.baseline.outputs.found == 'true'
        id: test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          set +e
          ready-ai test \
            --doc "./docs-baseline/docs.md" \
            --url "$STAGING_URL" \
            --threshold "$THRESHOLD" \
            --headless \
            --output "./regression-report"
          EXIT_CODE=$?
          set -e
          
          REPORT="./regression-report/test_report.json"
          if [ ! -s "$REPORT" ]; then
            echo "Regression runner exited $EXIT_CODE without producing $REPORT."
            exit 1
          fi

          STATUS=$(jq -er '.overall_status' "$REPORT")
          case "$STATUS" in
            PASSED|DRIFT_DETECTED|BROKEN) ;;
            *)
              echo "Unexpected documentation regression status: $STATUS"
              exit 1
              ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ] && [ "$STATUS" != "DRIFT_DETECTED" ]; then
            exit "$EXIT_CODE"
          fi

      # ─── Auto-regenerate on drift ─────────────────────────────────────
      - name: Regenerate documentation (drift detected)
        if: steps.test.outputs.status == 'DRIFT_DETECTED'
        id: regen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          mkdir -p ./docs-new
          
          # Prefer batch config if available
          if [ -f ".ready-ai.yaml" ] || [ -f ".ready-ai.yml" ]; then
            CONFIG=$(ls .ready-ai.yaml .ready-ai.yml 2>/dev/null | head -1)
            ready-ai batch \
              --config "$CONFIG" \
              --output "./output" \
              --headless
          else
            ready-ai run \
              --goal "Document main user flows" \
              --url "$STAGING_URL" \
              --output "./output" \
              --headless
          fi
          
          # Export all new runs
          for run_dir in ./output/*/; do
            [ -d "$run_dir" ] || continue
            run_id=$(basename "$run_dir")
            if [ -f "$run_dir/docs.md" ]; then
              ready-ai export \
                --run-id "$run_id" \
                --format markdown \
                --output-dir "./docs-new/$run_id"
            fi
          done
          
          echo "regenerated=true" >> $GITHUB_OUTPUT

      - name: Commit regenerated docs to PR
        if: steps.regen.outputs.regenerated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p docs/latest
          cp -r ./docs-new/* docs/latest/ 2>/dev/null || true
          
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-regenerate documentation due to UI drift [skip ci]"
            git push
          fi

      # ─── Upload artifacts ─────────────────────────────────────────────
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_id }}
          path: |
            ./regression-report/
            ./output/
          retention-days: 14
          if-no-files-found: ignore

      # ─── PR comment ──────────────────────────────────────────────────
      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.test.outputs.status || 'SKIPPED' }}';
            
            let body = '## 📋 Documentation Regression Test\n\n';
            
            if (status === 'SKIPPED') {
              body += '⚠️ **Regression test skipped.** Configure a staging URL and generate a non-empty baseline before enabling this check.\n';
            } else if (status === 'PASSED') {
              body += '✅ **All documentation steps are up to date!**\n\n';
              body += 'No UI drift detected. Screenshots match baseline within threshold.\n';
            } else if (status === 'DRIFT_DETECTED') {
              body += '⚠️ **UI drift detected — documentation auto-regenerated!**\n\n';
              body += 'Docs were automatically updated and committed to this PR.\n';
            } else if (status === 'BROKEN') {
              body += '❌ **Broken steps detected!**\n\n';
              body += 'Some documented steps no longer execute correctly. Manual review required.\n';
              body += '\n**CI Status:** ❌ FAILED (blocking merge)\n';
            } else {
              body += `ℹ️ **Status:** ${status}\n`;
            }
            
            // Add metrics if report exists
            const reportPath = './regression-report/test_report.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              body += `\n| Metric | Value |\n|---|---|\n`;
              body += `| Steps tested | ${(report.results ? report.results.length : 'N/A')} |\n`;
              body += `| Status | ${report.overall_status} |\n`;
            }
            
            body += `\n[View full report & artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # ─── Fail CI if broken ────────────────────────────────────────────
      - name: Fail on broken steps
        if: steps.test.outputs.status == 'BROKEN'
        run: |
          echo "❌ Documentation regression detected broken steps."
          echo "Review the report and fix the UI or update selectors."
          exit 1
