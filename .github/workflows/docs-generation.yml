name: Generate Documentation

on:
  # Run on every release/tag push
  push:
    tags:
      - "v*"
  # Manual trigger
  workflow_dispatch:
    inputs:
      app_version:
        description: "Application version"
        required: true
        default: "0.0.0"
      base_url:
        description: "Base URL of the application"
        required: true
        default: "https://app.example.com"
      config_file:
        description: "Path to batch config file (optional)"
        required: false
        default: ""

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # Install Chrome for headless browser automation
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Determine version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.app_version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (v1.2.3 -> 1.2.3)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "deployed=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Run documentation batch (config file)
        if: github.event.inputs.config_file != '' || hashFiles('.ready-ai.yaml') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          CONFIG="${{ github.event.inputs.config_file || '.ready-ai.yaml' }}"
          ready-ai batch \
            --config "$CONFIG" \
            --app-version "${{ steps.version.outputs.version }}" \
            --git-commit "${{ steps.version.outputs.commit }}" \
            --deployed-at "${{ steps.version.outputs.deployed }}"

      - name: Run documentation batch (webhook payload)
        if: github.event.inputs.config_file == '' && hashFiles('.ready-ai.yaml') == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          # Call the API server's deploy webhook
          curl -X POST http://localhost:8000/webhooks/deploy \
            -H "Content-Type: application/json" \
            -d '{
              "app_version": "${{ steps.version.outputs.version }}",
              "git_commit": "${{ steps.version.outputs.commit }}",
              "deployed_at": "${{ steps.version.outputs.deployed }}",
              "base_url": "${{ github.event.inputs.base_url || 'https://app.example.com' }}",
              "flows": [
                {"goal": "Document main features", "path": "/"}
              ]
            }'

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ steps.version.outputs.version }}
          path: ./output/
          retention-days: 30

      - name: Commit docs to docs branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create or checkout docs branch
          git checkout -b docs/${{ steps.version.outputs.version }} || git checkout docs/${{ steps.version.outputs.version }}
          
          # Copy generated docs
          mkdir -p docs/${{ steps.version.outputs.version }}
          cp -r ./output/* docs/${{ steps.version.outputs.version }}/
          
          git add docs/
          git commit -m "docs: generate documentation for v${{ steps.version.outputs.version }}" || true
          git push origin docs/${{ steps.version.outputs.version }} || true
