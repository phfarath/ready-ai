name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/ tests/ main.py ready_ai/ examples/
      - name: Layer contracts with import-linter (REF-02)
        run: lint-imports

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Strict mypy on the public SDK + typed examples
        run: python -m mypy

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: pip install build && python -m build --wheel
      - name: Install wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/python -c "import ready_ai; assert ready_ai.__version__; print('import-ok', ready_ai.__version__)"
          /tmp/wheelenv/bin/ready-ai --help >/dev/null
          echo "wheel-install-ok"

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: python -m pytest -q --ignore=tests/e2e --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: "Warm up Chrome (first launch on cold runners exceeds the 10s WS budget)"
        run: python3 -c "import asyncio, sys; sys.path.insert(0, '.'); from src.cdp.browser import launch_chrome, get_ws_url; p = launch_chrome(port=9333, headless=True, no_sandbox=True); asyncio.run(get_ws_url(9333, retries=30, delay=1.0)); p.terminate(); p.wait(timeout=15); print('chrome-warm')"

      - name: "Run real-browser E2E (slice 1 - SPA and Shadow DOM)"
        env:
          CHROME_NO_SANDBOX: "1"
        run: python -m pytest tests/e2e -q
