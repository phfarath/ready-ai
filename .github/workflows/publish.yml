name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ready-ai
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # ─── Trusted Publishing (OIDC) ────────────────────────────
      # No API token needed! GitHub & PyPI exchange a short-lived token automatically.
      # YOU MUST configure this in PyPI first (see docs/USAGE-IN-OTHER-REPOS.md)
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
